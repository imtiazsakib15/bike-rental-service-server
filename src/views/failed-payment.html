<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Payment Failed</title>
    <style>
      body {
        background-color: #ffecec;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background-color: #ffffff;
        padding: 30px 40px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
      }
      .icon {
        font-size: 48px;
        color: #e11d48;
        margin-bottom: 15px;
      }
      .title {
        font-size: 24px;
        color: #b91c1c;
        margin-bottom: 10px;
      }
      .description {
        color: #555;
        margin-bottom: 20px;
      }
      .transaction {
        font-size: 14px;
        color: #333;
        margin-bottom: 25px;
      }
      .btn {
        background-color: #e11d48;
        color: #fff;
        padding: 10px 20px;
        text-decoration: none;
        border-radius: 6px;
      }
      .btn:hover {
        background-color: #be123c;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">❌</div>
      <div class="title">Payment Failed</div>
      <div class="description">
        Unfortunately, your payment was not successful.
      </div>
      <a class="btn" href="{{homePage}}">Try Again</a>
    </div>
  </body>
</html>
